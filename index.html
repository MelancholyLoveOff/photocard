<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Studio - RPG</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-base: #000000;
            --panel-bg: #121212;
            --accent: #1ed760;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base); color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* ÁREA DO POSTER (TOPO) */
        .workspace {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden; position: relative; padding: 20px;
        }

        .poster-container {
            width: 100%; max-width: 400px; aspect-ratio: 4/5; /* Formato retrato clássico de redes sociais */
            background-color: #282828; background-size: cover; background-position: center;
            position: relative; overflow: hidden; border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            touch-action: none;
        }

        /* ELEMENTOS ARRASTÁVEIS NO POSTER */
        .draggable-text {
            position: absolute; color: white; font-size: 32px; font-weight: 700;
            white-space: pre-wrap; /* Permite quebrar linha com Enter */
            cursor: move; user-select: none; text-align: center;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            left: 50%; top: 50%;
            outline: none;
            border: 2px dashed transparent;
            padding: 8px 16px;
            line-height: 1.2;
            max-width: 95%; /* Impede que saia da tela */
            width: max-content;
            border-radius: 8px;
        }
        
        .draggable-text.active { border-color: var(--accent); background: rgba(0,0,0,0.4) !important; z-index: 10;}

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 0;
        }

        /* PAINEL DE CONTROLE (BASE) */
        .controls-panel {
            background: var(--panel-bg); border-top: 1px solid var(--glass);
            height: 50vh; min-height: 380px; display: flex; flex-direction: column;
            border-radius: 24px 24px 0 0; padding: 20px; z-index: 10;
        }

        /* ABAS */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--glass); border: none; color: var(--text-muted);
            padding: 10px 16px; border-radius: 500px; font-weight: 700; font-size: 13px;
            white-space: nowrap; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--text-main); color: #000; }

        /* CONTEÚDO DAS ABAS */
        .tab-content { flex: 1; overflow-y: auto; display: none; padding-bottom: 20px; }
        .tab-content.active { display: block; }
        .tab-content::-webkit-scrollbar { display: none; }

        /* GRIDS E BOTÕES */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .action-btn {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05); color: white;
            padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px;
            text-align: center;
        }
        .action-btn i { font-size: 20px; color: var(--accent); }
        .action-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.15); }

        .template-btn {
            height: 90px; border-radius: 8px; border: 2px solid transparent; cursor: pointer;
            position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .template-btn span { z-index: 2; color: white; font-weight: 800; font-size: 11px; text-align: center; margin-top: 8px;}
        .template-btn i { font-size: 20px; color: white; z-index: 2;}

        /* FERRAMENTAS DE TEXTO */
        .tool-group { margin-bottom: 16px; }
        .tool-group label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px;}
        
        select, input[type="range"] {
            width: 100%; background: var(--glass); border: none; color: white;
            padding: 12px; border-radius: 8px; outline: none; font-size: 14px; font-weight: 600;
        }
        
        .color-picker-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .color-btn.active { border-color: white; transform: scale(1.1); }
        .color-btn.transparent { background: repeating-linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333), repeating-linear-gradient(45deg, #333 25%, #111 25%, #111 75%, #333 75%, #333); background-position: 0 0, 8px 8px; background-size: 16px 16px; }

        .align-btn { background: var(--glass); border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 16px; flex: 1;}
        .align-btn.active { background: var(--accent); color: #000; }

        .btn-primary {
            background: var(--accent); color: #000; width: 100%; padding: 16px;
            border: none; border-radius: 500px; font-size: 16px; font-weight: 900;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 20px;
        }
        .btn-primary:active { transform: scale(0.98); background: #1bd05b; }

        /* LOADER UPLOAD */
        #loaderUpload { display: none; text-align: center; font-size: 12px; color: var(--accent); margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="workspace" id="workspace">
        <div class="poster-container" id="poster">
            <div class="overlay" id="posterOverlay"></div>
            <div class="draggable-text" style="top: 15%; left: 50%; font-size: 14px; font-weight: 900; color: #ffffff; background-color: #ff4444; text-shadow: none; letter-spacing: 2px;" contenteditable="true" spellcheck="false"> URGENTE </div>
            <div class="draggable-text" style="top: 80%; left: 50%; font-size: 40px; font-weight: 900; letter-spacing: -1px; text-align: left; width: 90%;" contenteditable="true" spellcheck="false">ARTISTA ATINGE O TOPO DOS CHARTS GLOBAIS</div>
            <div class="draggable-text" style="top: 92%; left: 50%; font-size: 16px; font-weight: 500; color: #e0e0e0; text-align: left; width: 90%;" contenteditable="true" spellcheck="false">A nova atualização quebra recordes históricos no Spotify.</div>
        </div>
    </div>

    <div class="controls-panel">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tabFundo')">Arte & Fundo</button>
            <button class="tab-btn" onclick="switchTab('tabTemplates')">Modelos Prontos</button>
            <button class="tab-btn" onclick="switchTab('tabTexto')">Editar Elemento</button>
        </div>

        <div id="tabFundo" class="tab-content active">
            <div class="grid-2">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-image"></i>
                    Alterar Foto
                </button>
                <button class="action-btn" onclick="adicionarTexto()">
                    <i class="fas fa-plus-circle"></i>
                    Adicionar Texto
                </button>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadToImgBB(event)">
            <div id="loaderUpload"><i class="fas fa-circle-notch fa-spin"></i> Fazendo Upload...</div>

            <div class="tool-group" style="margin-top: 24px;">
                <label>Sombra do Fundo (Realçar Leitura)</label>
                <input type="range" id="overlayOpacity" min="0" max="100" value="70" oninput="updateOverlay()">
            </div>

            <button class="btn-primary" onclick="exportarPoster()">
                <i class="fas fa-download"></i> Salvar Imagem Final
            </button>
        </div>

        <div id="tabTemplates" class="tab-content">
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Sua foto atual será mantida. Escolha o formato da notícia:</p>
            <div class="grid-4">
                <div class="template-btn" style="background: linear-gradient(135deg, #cc0000, #4a0000);" onclick="aplicarTemplate('noticia')">
                    <i class="fas fa-bolt"></i>
                    <span>Plantão / Notícia</span>
                </div>
                <div class="template-btn" style="background: linear-gradient(135deg, #1ed760, #0a4d22);" onclick="aplicarTemplate('lancamento')">
                    <i class="fas fa-music"></i>
                    <span>Lançamento</span>
                </div>
                <div class="template-btn" style="background: linear-gradient(135deg, #444, #111);" onclick="aplicarTemplate('aspa')">
                    <i class="fas fa-quote-left"></i>
                    <span>Entrevista</span>
                </div>
                <div class="template-btn" style="background: linear-gradient(135deg, #302191, #121212);" onclick="aplicarTemplate('thisis')">
                    <i class="fab fa-spotify"></i>
                    <span>This Is</span>
                </div>
            </div>
        </div>

        <div id="tabTexto" class="tab-content">
            <p id="noTextAlert" style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Toque em um texto no poster acima para editar o design dele.</p>
            
            <div id="textTools" style="opacity: 0.5; pointer-events: none; transition: 0.3s;">
                
                <div class="grid-2">
                    <div class="tool-group">
                        <label>Estilo / Fonte</label>
                        <select id="fontFamily" onchange="updateSelectedText()">
                            <option value="Montserrat">Moderno</option>
                            <option value="Bebas Neue">Impacto (Notícias)</option>
                            <option value="Playfair Display">Jornalístico (Serifa)</option>
                        </select>
                    </div>
                    <div class="tool-group">
                        <label>Tamanho</label>
                        <input type="range" id="fontSize" min="10" max="120" value="32" oninput="updateSelectedText()">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="tool-group">
                        <label>Cor da Letra</label>
                        <div class="color-picker-wrap">
                            <div class="color-btn" style="background: #ffffff;" onclick="changeTextColor('#ffffff')"></div>
                            <div class="color-btn" style="background: #000000; border-color: #555;" onclick="changeTextColor('#000000')"></div>
                            <div class="color-btn" style="background: #1ed760;" onclick="changeTextColor('#1ed760')"></div>
                        </div>
                    </div>
                    
                    <div class="tool-group">
                        <label>Cor do Fundo (Tarja)</label>
                        <div class="color-picker-wrap">
                            <div class="color-btn transparent" onclick="changeTextBg('transparent')"></div>
                            <div class="color-btn" style="background: #000000; border-color: #555;" onclick="changeTextBg('#000000')"></div>
                            <div class="color-btn" style="background: #ff4444;" onclick="changeTextBg('#ff4444')"></div>
                            <div class="color-btn" style="background: #ffffff;" onclick="changeTextBg('#ffffff')"></div>
                        </div>
                    </div>
                </div>

                <div class="grid-2" style="align-items: center;">
                    <div class="tool-group" style="margin-bottom: 0;">
                        <label>Alinhamento</label>
                        <div style="display: flex; gap: 8px;">
                            <button class="align-btn active" id="align-left" onclick="changeTextAlign('left')"><i class="fas fa-align-left"></i></button>
                            <button class="align-btn" id="align-center" onclick="changeTextAlign('center')"><i class="fas fa-align-center"></i></button>
                            <button class="align-btn" id="align-right" onclick="changeTextAlign('right')"><i class="fas fa-align-right"></i></button>
                        </div>
                    </div>

                    <button class="action-btn" style="border-color: rgba(255,68,68,0.3); color: #ff4444; flex-direction: row; justify-content: center; height: 40px; margin-top: 14px;" onclick="deletarTexto()">
                        <i class="fas fa-trash" style="color: #ff4444; font-size: 14px;"></i> Excluir
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // API KEY do ImgBB 
        const IMGBB_API_KEY = '81f7ca81cf22d739de576bd1dac7dcc2';
        const poster = document.getElementById('poster');
        let selectedTextElement = null;

        // -----------------------------------------
        // NAVEGAÇÃO
        // -----------------------------------------
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // -----------------------------------------
        // INTEGRAÇÃO IMGBB (UPLOAD)
        // -----------------------------------------
        async function uploadToImgBB(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loaderUpload').style.display = 'block';

            // Preview local
            const reader = new FileReader();
            reader.onload = function(e) {
                poster.style.backgroundImage = `url('${e.target.result}')`;
            }
            reader.readAsDataURL(file);

            // Upload real
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    poster.style.backgroundImage = `url('${data.data.url}')`;
                }
            } catch (err) {
                console.error("Erro no ImgBB:", err);
            } finally {
                document.getElementById('loaderUpload').style.display = 'none';
            }
        }

        function updateOverlay() {
            const val = document.getElementById('overlayOpacity').value;
            const op = val / 100;
            document.getElementById('posterOverlay').style.background = `linear-gradient(to bottom, rgba(0,0,0,${Math.max(0, op - 0.5)}) 0%, rgba(0,0,0,${op}) 100%)`;
        }

        // -----------------------------------------
        // DRAG & DROP E SELEÇÃO
        // -----------------------------------------
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        function selectText(el) {
            document.querySelectorAll('.draggable-text').forEach(t => t.classList.remove('active'));
            selectedTextElement = el;
            el.classList.add('active');

            document.getElementById('textTools').style.opacity = '1';
            document.getElementById('textTools').style.pointerEvents = 'all';
            document.getElementById('noTextAlert').style.display = 'none';

            // Puxa as configs do texto para o painel
            document.getElementById('fontSize').value = parseInt(window.getComputedStyle(el).fontSize);
            
            let fontName = window.getComputedStyle(el).fontFamily.replace(/['"]/g, '').split(',')[0];
            document.getElementById('fontFamily').value = fontName;

            // Atualiza botões de alinhamento
            document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
            const align = window.getComputedStyle(el).textAlign;
            if(document.getElementById(`align-${align}`)) document.getElementById(`align-${align}`).classList.add('active');
            
            // Troca para a aba de edição
            switchTab('tabTexto');
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
        }

        poster.addEventListener('mousedown', (e) => {
            if (e.target === poster || e.target.id === 'posterOverlay') {
                document.querySelectorAll('.draggable-text').forEach(t => t.classList.remove('active'));
                selectedTextElement = null;
                document.getElementById('textTools').style.opacity = '0.5';
                document.getElementById('textTools').style.pointerEvents = 'none';
                document.getElementById('noTextAlert').style.display = 'block';
            }
        });

        // Touch e Mouse listeners
        poster.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

        poster.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            const target = e.target.closest('.draggable-text');
            if (target) {
                selectText(target);
                if (document.activeElement === target && target.getAttribute('contenteditable') === 'true') return; 

                isDragging = true;
                const evt = e.type.includes('mouse') ? e : e.touches[0];
                const rect = target.getBoundingClientRect();
                
                dragOffset.x = evt.clientX - rect.left - (rect.width / 2);
                dragOffset.y = evt.clientY - rect.top - (rect.height / 2);
            }
        }

        function dragMove(e) {
            if (!isDragging || !selectedTextElement) return;
            e.preventDefault(); 

            const evt = e.type.includes('mouse') ? e : e.touches[0];
            const containerRect = poster.getBoundingClientRect();

            let x = ((evt.clientX - containerRect.left - dragOffset.x) / containerRect.width) * 100;
            let y = ((evt.clientY - containerRect.top - dragOffset.y) / containerRect.height) * 100;

            selectedTextElement.style.left = `${x}%`;
            selectedTextElement.style.top = `${y}%`;
        }

        function dragEnd() {
            isDragging = false;
        }

        // -----------------------------------------
        // FERRAMENTAS DO TEXTO SELECIONADO
        // -----------------------------------------
        function updateSelectedText() {
            if (!selectedTextElement) return;
            selectedTextElement.style.fontSize = `${document.getElementById('fontSize').value}px`;
            selectedTextElement.style.fontFamily = document.getElementById('fontFamily').value;
        }

        function changeTextColor(color) {
            if (!selectedTextElement) return;
            selectedTextElement.style.color = color;
        }

        function changeTextBg(color) {
            if (!selectedTextElement) return;
            selectedTextElement.style.backgroundColor = color;
            if(color !== 'transparent') {
                selectedTextElement.style.textShadow = 'none'; // Tira sombra se tiver fundo sólido
            } else {
                selectedTextElement.style.textShadow = '0 4px 12px rgba(0,0,0,0.6)';
            }
        }

        function changeTextAlign(align) {
            if (!selectedTextElement) return;
            selectedTextElement.style.textAlign = align;
            document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`align-${align}`).classList.add('active');
        }

        function adicionarTexto() {
            const el = document.createElement('div');
            el.className = 'draggable-text';
            el.contentEditable = "true";
            el.spellcheck = false;
            el.textContent = "Digite seu texto...";
            el.style.left = '50%'; el.style.top = '50%';
            el.style.fontSize = '24px'; el.style.fontFamily = 'Montserrat';
            el.style.color = '#ffffff'; el.style.backgroundColor = 'transparent'; el.style.textAlign = 'center';
            poster.appendChild(el);
            selectText(el);
        }

        function deletarTexto() {
            if (selectedTextElement) {
                selectedTextElement.remove();
                selectedTextElement = null;
                document.getElementById('textTools').style.opacity = '0.5';
                document.getElementById('textTools').style.pointerEvents = 'none';
                document.getElementById('noTextAlert').style.display = 'block';
            }
        }

        // -----------------------------------------
        // TEMPLATES (NOTÍCIA E LANÇAMENTO)
        // -----------------------------------------
        function limparTextos() {
            document.querySelectorAll('.draggable-text').forEach(el => el.remove());
        }

        function aplicarTemplate(tipo) {
            limparTextos();
            let html = '';

            if (tipo === 'noticia') {
                document.getElementById('overlayOpacity').value = 70; updateOverlay();
                html = `
                    <div class="draggable-text" style="top: 15%; left: 50%; font-size: 14px; font-weight: 900; color: #ffffff; background-color: #ff4444; text-shadow: none; letter-spacing: 2px;" contenteditable="true" spellcheck="false"> URGENTE </div>
                    <div class="draggable-text" style="top: 80%; left: 50%; font-size: 40px; font-weight: 900; letter-spacing: -1px; text-align: left; width: 90%; font-family: 'Montserrat';" contenteditable="true" spellcheck="false">ARTISTA ATINGE O TOPO DOS CHARTS GLOBAIS</div>
                    <div class="draggable-text" style="top: 92%; left: 50%; font-size: 16px; font-weight: 500; color: #e0e0e0; text-align: left; width: 90%;" contenteditable="true" spellcheck="false">A nova atualização quebra recordes históricos.</div>
                `;
            } 
            else if (tipo === 'lancamento') {
                document.getElementById('overlayOpacity').value = 60; updateOverlay();
                html = `
                    <div class="draggable-text" style="top: 15%; left: 50%; font-size: 16px; font-weight: 900; color: #000000; background-color: #1ed760; text-shadow: none; letter-spacing: 1px;" contenteditable="true" spellcheck="false"> DISPONÍVEL AGORA </div>
                    <div class="draggable-text" style="top: 80%; left: 50%; font-size: 48px; font-family: 'Bebas Neue'; font-weight: 400; letter-spacing: 2px; color: #ffffff; text-align: center; width: 90%;" contenteditable="true" spellcheck="false">NOME DO SINGLE</div>
                    <div class="draggable-text" style="top: 90%; left: 50%; font-size: 18px; font-weight: 700; color: #b3b3b3;" contenteditable="true" spellcheck="false">Ouça no Spotify</div>
                `;
            }
            else if (tipo === 'aspa') {
                document.getElementById('overlayOpacity').value = 85; updateOverlay();
                html = `
                    <div class="draggable-text" style="top: 15%; left: 50%; font-size: 80px; font-family: 'Playfair Display'; color: #1ed760; font-style: italic;" contenteditable="true" spellcheck="false">"</div>
                    <div class="draggable-text" style="top: 50%; left: 50%; font-size: 28px; font-family: 'Playfair Display'; font-weight: 700; color: #ffffff; text-align: center; width: 85%; line-height: 1.4;" contenteditable="true" spellcheck="false">Eu coloquei todo o meu coração neste novo projeto. É a minha era mais honesta.</div>
                    <div class="draggable-text" style="top: 85%; left: 50%; font-size: 14px; font-weight: 700; color: #b3b3b3; letter-spacing: 2px; text-transform: uppercase;" contenteditable="true" spellcheck="false">— NOME DO ARTISTA</div>
                `;
            }
            else if (tipo === 'thisis') {
                document.getElementById('overlayOpacity').value = 75; updateOverlay();
                html = `
                    <div class="draggable-text logo-spotify" style="top: 8%; left: 12%; font-size: 32px; color: #ffffff;" contenteditable="false"><i class="fab fa-spotify"></i></div>
                    <div class="draggable-text" style="top: 75%; left: 50%; font-size: 72px; font-weight: 900; color: #ffffff; letter-spacing: -2px;" contenteditable="true" spellcheck="false">This Is</div>
                    <div class="draggable-text" style="top: 88%; left: 50%; font-size: 32px; font-weight: 700; color: #1ed760;" contenteditable="true" spellcheck="false">Artista</div>
                `;
            }

            poster.insertAdjacentHTML('beforeend', html);
            
            document.querySelectorAll('.draggable-text').forEach(el => {
                el.addEventListener('focus', () => selectText(el));
            });
        }

        // Eventos iniciais
        document.querySelectorAll('.draggable-text').forEach(el => {
            el.addEventListener('focus', () => selectText(el));
        });

        // -----------------------------------------
        // EXPORTAÇÃO
        // -----------------------------------------
        function exportarPoster() {
            // Esconde UI de edição antes do print
            document.querySelectorAll('.draggable-text').forEach(t => t.classList.remove('active'));
            selectedTextElement = null;

            html2canvas(poster, {
                useCORS: true,
                allowTaint: false,
                backgroundColor: '#111111',
                scale: window.devicePixelRatio || 2,
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `media_rpg_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert("Erro ao gerar a imagem. Lembre-se de fazer upload da foto pelo botão primeiro.");
            });
        }
    </script>
</body>
</html>
